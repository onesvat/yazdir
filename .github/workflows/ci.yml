name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install pypdf pytest ruff
      - name: Lint
        run: ruff check src tests tools
      - name: Test
        run: pytest -q
      - name: Check translations
        run: |
          sudo apt-get install -y -qq gettext >/dev/null
          msgfmt -c --statistics -o /dev/null src/yazdir/locale/tr.po
