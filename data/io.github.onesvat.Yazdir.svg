<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0bfbc"/>
      <stop offset="1" stop-color="#9a9996"/>
    </linearGradient>
  </defs>
  <!-- back sheet (printed side) -->
  <g transform="rotate(-8 64 40)">
    <rect x="34" y="8" width="52" height="64" rx="3" fill="#ffffff" stroke="#9a9996" stroke-width="2"/>
    <rect x="42" y="18" width="30" height="4" rx="2" fill="#77767b"/>
    <rect x="42" y="27" width="36" height="3" rx="1.5" fill="#c0bfbc"/>
    <rect x="42" y="34" width="32" height="3" rx="1.5" fill="#c0bfbc"/>
  </g>
  <!-- front sheet with page number -->
  <g transform="rotate(6 64 40)">
    <rect x="42" y="14" width="52" height="64" rx="3" fill="#ffffff" stroke="#9a9996" stroke-width="2"/>
    <text x="68" y="56" font-family="Cantarell, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#3584e4">2</text>
  </g>
  <!-- printer -->
  <rect x="12" y="58" width="104" height="44" rx="10" fill="url(#body)" stroke="#77767b" stroke-width="2"/>
  <rect x="12" y="84" width="104" height="18" rx="6" fill="url(#front)"/>
  <rect x="28" y="66" width="72" height="6" rx="3" fill="#5e5c64"/>
  <circle cx="102" cy="74" r="4" fill="#33d17a"/>
  <!-- turn-over arrow -->
  <path d="M24 112 C 40 126, 88 126, 104 112" fill="none" stroke="#e66100" stroke-width="6" stroke-linecap="round"/>
  <path d="M96 104 L108 110 L100 120 Z" fill="#e66100"/>
</svg>
