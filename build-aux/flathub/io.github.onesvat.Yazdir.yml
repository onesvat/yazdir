# Manifest for the Flathub submission: same as build-aux/flatpak, but builds the tagged release.
id: io.github.onesvat.Yazdir
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: yazdir

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Talk to the host's CUPS server to list printers, submit jobs and watch the queue.
  - --socket=cups

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'

modules:
  - name: python3-pypdf
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-index --find-links="file://${PWD}" pypdf
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/18/42/a945f65cc61c739ec80f4112c4b78ed1791f25d33f45f19389c9c9e247e2/pypdf-6.20.0-py3-none-any.whl
        sha256: f003fc2014814d264fe7dd3f9d435c158e23e1a85a2233f87a0a2d6d21c914ad

  - name: python3-pillow
    buildsystem: simple
    build-commands:
      # pybind11 is only needed to build Pillow's C extensions.
      - pip3 install --prefix=/app --no-deps --no-index --find-links="file://${PWD}" pybind11
      - pip3 install --prefix=/app --no-deps --no-index --no-build-isolation --find-links="file://${PWD}" pillow
    cleanup:
      - /bin/pybind11-config
      - /lib/python3*/site-packages/pybind11*
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/33/fd/8762f7ee3e4e4be6d1d846cffb4916dd9bb02b2f800d3603718a0efe494c/pybind11-3.1.0-py3-none-any.whl
        sha256: b8488090f8acffbcb6b5d6a85571a6827a0a2981ffb75e5a0b27b87c4a6b7dd0
      - type: file
        url: https://files.pythonhosted.org/packages/1c/3d/bb7fca845737cf9d7dbde16ed1843984665ff2e0a518f5db43e77ec540b9/pillow-12.3.0.tar.gz
        sha256: 3b8182a766685eaa002637e28b4ec8d6b18819a0c71f579bf0dbaa5830297cce

  - name: python3-pycups
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-index --no-build-isolation --find-links="file://${PWD}" pycups
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/96/c4/b077f0422cd031e4f3a47c75ce0bcf77f2f2e5bf3648f6945a4d09fd44a5/pycups-2.0.4.tar.gz
        sha256: 843e385c1dbf694996ca84ef02a7f30c28376035588f5fbeacd6bae005cf7c8d

  - name: yazdir
    buildsystem: simple
    build-commands:
      - install -d /app/share/yazdir
      - cp -r src/yazdir /app/share/yazdir/
      - rm -f /app/share/yazdir/yazdir/locale/yazdir.pot
      - python3 -m compileall -q /app/share/yazdir
      - install -Dm755 build-aux/flatpak/yazdir.sh /app/bin/yazdir
      - install -Dm644 data/io.github.onesvat.Yazdir.desktop -t /app/share/applications
      - install -Dm644 data/io.github.onesvat.Yazdir.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 data/io.github.onesvat.Yazdir.metainfo.xml -t /app/share/metainfo
    sources:
      - type: git
        url: https://github.com/onesvat/yazdir.git
        tag: v1.1.1
        commit: a73443e1441db2a11a9287f816395676aa52036f
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
