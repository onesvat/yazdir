<svg xmlns="http://www.w3.org/2000/svg" width="660" height="290" viewBox="0 0 660 290" font-family="Cantarell, sans-serif">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e01b24"/>
    </marker>
    <!-- Yazıcı gövdesi (eğik görünüm): ön yüz, üst yüz, sağ yan -->
    <g id="yazici" stroke="#555" stroke-width="1.6" stroke-linejoin="round">
      <path d="M50 120 L240 120 L290 80 L100 80 Z" fill="#f2f2f2"/>
      <path d="M240 120 L290 80 L290 180 L240 220 Z" fill="#d9d9d9"/>
      <rect x="50" y="120" width="190" height="100" fill="#ebebeb"/>
      <!-- üstteki çıktı yuvası -->
      <path d="M115 88 L265 88 L255 96 L105 96 Z" fill="#888" stroke="none"/>
      <!-- ön kapak çizgileri ve giriş yuvası -->
      <line x1="62" y1="150" x2="228" y2="150" stroke="#bbb"/>
      <rect x="85" y="196" width="125" height="8" rx="2" fill="#777" stroke="none"/>
      <circle cx="225" cy="135" r="4" fill="#9c9" stroke="#585"/>
    </g>
    <!-- Öndeki besleme tepsisi (açık) -->
    <path id="tepsi" d="M85 204 L210 204 L175 252 L50 252 Z" fill="#e3e3e3" stroke="#555" stroke-width="1.6" stroke-linejoin="round"/>
  </defs>

  <rect width="660" height="290" rx="12" fill="#ffffff"/>

  <!-- 1. adım -->
  <g>
    <text x="20" y="22" font-size="15" font-weight="bold" fill="#3d3d3d">1. Desteyi üstten alın</text>
    <use href="#yazici"/>
    <use href="#tepsi"/>
    <!-- çıktı tepsisindeki deste: B yazıcı tarafında, A önde -->
    <path d="M118 112 L240 112 L262 94 L140 94 Z" fill="#f5b8cf" stroke="#c0567f" stroke-width="1.4"/>
    <path d="M118 116 L240 116 L240 112 L118 112 Z" fill="#e89ab8" stroke="#c0567f" stroke-width="1"/>
    <text x="150" y="91" font-size="14" font-weight="bold" fill="#e66100">B</text>
    <text x="172" y="130" font-size="14" font-weight="bold" fill="#3584e4" text-anchor="middle">A</text>
    <path d="M210 98 C 235 50, 280 40, 305 52" fill="none" stroke="#e01b24" stroke-width="3" marker-end="url(#ok)"/>
  </g>

  <!-- ayraç -->
  <line x1="348" y1="262" x2="392" y2="34" stroke="#999" stroke-width="1.5"/>

  <!-- 2. adım -->
  <g transform="translate(370 0)">
    <text x="20" y="22" font-size="15" font-weight="bold" fill="#3d3d3d">2. Çevirmeden öndeki tepsiye koyun</text>
    <use href="#yazici"/>
    <use href="#tepsi"/>
    <!-- besleme tepsisindeki deste: B yazıcıya doğru, A size dönük -->
    <path d="M92 210 L200 210 L172 246 L64 246 Z" fill="#f5b8cf" stroke="#c0567f" stroke-width="1.4"/>
    <path d="M64 246 L172 246 L172 250 L64 250 Z" fill="#e89ab8" stroke="#c0567f" stroke-width="1"/>
    <text x="146" y="222" font-size="14" font-weight="bold" fill="#e66100" text-anchor="middle">B</text>
    <text x="118" y="268" font-size="14" font-weight="bold" fill="#3584e4" text-anchor="middle">A</text>
    <path d="M250 60 C 300 90, 300 200, 205 232" fill="none" stroke="#e01b24" stroke-width="3" marker-end="url(#ok)"/>
  </g>

  <text x="330" y="286" font-size="13" text-anchor="middle" fill="#666">Boş yüzler üstte kalır · <tspan fill="#e66100" font-weight="bold">B</tspan> yazıcıya doğru, <tspan fill="#3584e4" font-weight="bold">A</tspan> size dönük</text>
</svg>
